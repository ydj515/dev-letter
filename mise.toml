[tools]
node = "24.12.0"

[tasks.default]
description = "Default task (runs dev)"
depends = ["dev"]

[tasks.setup]
alias = "s"
description = "Install dependencies"
depends = ["install"]

[tasks.install]
alias = "i"
description = "Install dependencies"
run = "npm install"

[tasks.dev]
alias = "d"
description = "Run the development server"
run = "npm run dev"

[tasks.build]
alias = "b"
description = "Build the application"
run = "npm run build"

[tasks.start]
alias = "st"
description = "Start the production server"
run = "npm run start"

[tasks.lint]
alias = "l"
description = "Run the linter"
run = "npm run lint"

[tasks.seed]
description = "Seed newsletter data"
run = "npm run seed:newsletter"

[tasks.cron]
alias = "c"
description = "Run the newsletter send cron"
run = "npm run cron:send"

[tasks.test]
alias = "t"
description = "Run newsletter tests"
run = "npm run test:newsletter"
